<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Game Zone</title>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--accent:#ff9800;--text:#f5f5f5;--muted:#c5c5c5;--line:#383838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:1px solid #595959;border-radius:9px;padding:10px 13px;background:#292929;color:#fff}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:#181818;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center}.top h1{font-size:1.1rem;margin:0;color:var(--accent);flex:1}.accent{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:800}
.wrap{max-width:820px;margin:auto;padding:12px 12px 30px}.status{padding:9px 11px;border-radius:9px;background:#202020;border:1px solid var(--line);margin:10px 0}.panel,.game-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.panel h2{font-size:1.05rem;color:var(--accent);margin:0 0 8px}.field{display:grid;gap:5px;margin:7px 0;flex:1;min-width:0}.field input{width:100%;min-width:0;background:#101010;color:#fff;border:1px solid #555;border-radius:8px;padding:10px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game-card{margin:0;display:flex;flex-direction:column;gap:9px}.game-card h2{margin:0;font-size:1rem;min-height:2.7em}.game-card button{width:100%;margin-top:auto}.hidden{display:none!important}.roomline{overflow-wrap:anywhere;color:#ffd180}.players{color:var(--muted);margin:6px 0}.board{display:grid;grid-template-columns:repeat(3,minmax(65px,100px));gap:7px;margin:12px 0}.cell{height:78px;font-size:2rem;font-weight:900;color:var(--accent);padding:0}.quizOptions{display:grid;gap:8px;max-width:500px}.quizOptions button{text-align:left}.canvasWrap{max-width:600px}.canvasWrap canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:8px;touch-action:none;border:1px solid #777}.guesslog{max-height:140px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.guesslog p{margin:4px 0}.dice{font-size:2.4rem;color:var(--accent)}a{color:#ffd180}
@media(max-width:420px){.game-grid{grid-template-columns:1fr}.top h1{font-size:1rem}.wrap{padding:10px 9px 24px}.cell{height:70px}}
</style>
</head>
<body>
<header class="top"><button type="button" onclick="goBack()" aria-label="Back to Indian website">← Back</button><h1>Indian Games</h1></header>
<main class="wrap">
<div id="globalStatus" class="status" role="status" aria-live="polite">Connecting…</div>
<section class="panel" aria-labelledby="roomHeading"><h2 id="roomHeading">Your name</h2><label class="field"><span>Display name</span><input id="playerName" maxlength="40" autocomplete="nickname" placeholder="Your name"></label><div class="row"><label class="field"><span>Friend's Room ID</span><input id="roomIdInput" maxlength="8" autocomplete="off" placeholder="Room ID"></label><button id="joinRoomBtn" type="button">Join room</button></div></section>
<section class="panel" aria-labelledby="chooseGame"><h2 id="chooseGame">Choose a game</h2><div class="game-grid" aria-label="Available games"><article class="game-card"><h2>⚡ Rapid Quiz Battle</h2><button type="button" data-game="quiz">Create room &amp; play</button></article><article class="game-card"><h2>🎨 Draw &amp; Guess</h2><button type="button" data-game="draw">Create room &amp; play</button></article><article class="game-card"><h2>🎲 Mini Ludo / Dice Race</h2><button type="button" data-game="dice">Create room &amp; play</button></article><article class="game-card"><h2>❎ Tic-Tac-Toe</h2><button type="button" data-game="ttt">Create room &amp; play</button></article></div></section>
<select id="gameType" class="hidden" aria-hidden="true" tabindex="-1"><option value="ttt">Tic-Tac-Toe</option><option value="quiz">Rapid Quiz Battle</option><option value="draw">Draw &amp; Guess</option><option value="dice">Mini Ludo / Dice Race</option></select><button id="createRoomBtn" class="hidden" type="button">Create room</button>
<section id="gamePanel" class="panel hidden" aria-labelledby="activeGameTitle"><h2 id="activeGameTitle">Game</h2><p id="roomLine" class="roomline"></p><p id="playersLine" class="players"></p><div id="gameContent"></div><div class="row" style="margin-top:12px"><button type="button" id="copyRoomBtn">Copy Room ID</button><button type="button" id="leaveRoomBtn">Leave room</button></div><p id="gameStatus" class="status" role="status" aria-live="polite">Room ready.</p></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDyXo7dNZXnSZkRKFnLujjiElMIjcuRQUs',authDomain:'indian-84a86.firebaseapp.com',projectId:'indian-84a86',storageBucket:'indian-84a86.firebasestorage.app',messagingSenderId:'333987809341',appId:'1:333987809341:web:27a351f770aa7b4e808254'};
const $=id=>document.getElementById(id);let app,auth,db,user=null,activeRoomId='',activeRoom=null,unsub=null,busy=false,canvas=null,ctx=null,drawing=false,lastPoint=null;
const questions=[{q:'Bharat ki rajdhani kya hai?',a:['Mumbai','New Delhi','Kolkata','Jaipur'],correct:1},{q:'Ek hafte mein kitne din hote hain?',a:['5','6','7','8'],correct:2},{q:'Suraj kis disha se ugta hai?',a:['North','South','East','West'],correct:2},{q:'Paani ka chemical formula kya hai?',a:['CO2','O2','H2O','NaCl'],correct:2},{q:'3 × 4 kitna hota hai?',a:['7','12','14','16'],correct:1},{q:'Bharat ka rashtriya pashu?',a:['Sher','Baagh','Hathi','Mor'],correct:1},{q:'Rainbow mein aam taur par kitne rang bataye jate hain?',a:['5','6','7','8'],correct:2}];
const words=['Mango','Bicycle','Elephant','House','Sun','Fish','Cup','Tree'];
function say(msg){$('globalStatus').textContent=msg}function gameSay(msg){$('gameStatus').textContent=msg}function cleanName(){return String($('playerName').value||user?.displayName||user?.email?.split('@')[0]||'Indian Player').replace(/[<>\u0000-\u001f]/g,'').trim().slice(0,40)||'Indian Player'}
window.goBack=()=>{location.href='index.html'};
try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;if(u){$('playerName').value=$('playerName').value||u.displayName||u.email?.split('@')[0]||'Indian Player';say('Firebase connected. Signed in: '+(u.displayName||u.email||'Indian account')+'.');$('createRoomBtn').disabled=false;$('joinRoomBtn').disabled=false;document.querySelectorAll('[data-game]').forEach(b=>b.disabled=false);}else{say('Please sign in on Indian first, then open Games.');$('createRoomBtn').disabled=true;$('joinRoomBtn').disabled=true;document.querySelectorAll('[data-game]').forEach(b=>b.disabled=true);}});}catch(e){say('Firebase initialization error: '+e.message)}
function roomRef(id){return doc(db,'games',id)}function randomId(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function initialState(type,uid){if(type==='ttt')return{board:Array(9).fill(''),turn:uid,winner:'',moves:0};if(type==='quiz')return{round:0,questionIndex:Math.floor(Math.random()*questions.length),answers:{},scores:{},finished:false};if(type==='draw')return{round:0,drawer:uid,strokes:[],guesses:[],solved:false};return{positions:{[uid]:0},turn:uid,dice:null,winner:'',rolls:0}}
async function createRoom(type){if(!user||busy)return;busy=true;try{const id=randomId(),name=cleanName();const room={type,status:'waiting',createdBy:user.uid,players:[{uid:user.uid,name}],createdAt:serverTimestamp(),state:initialState(type,user.uid),updatedAt:serverTimestamp()};await setDoc(roomRef(id),room);if(type==='draw')await setDoc(doc(db,'games',id,'private','secret'),{word:words[Math.floor(Math.random()*words.length)],createdBy:user.uid});$('roomIdInput').value=id;watchRoom(id);say('Room created. Share Room ID '+id+' with your friend.')}catch(e){say('Could not create room: '+e.message+' Check Firestore rules.')}finally{busy=false}}
async function joinRoom(id){if(!user||busy)return;id=String(id||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(id)){say('Room ID must be 6 characters.');return}busy=true;try{const ref=roomRef(id);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Room not found. Check the Room ID.');const r=snap.data();if(r.players.some(p=>p.uid===user.uid))return;if(r.players.length>=2)throw Error('Room is already full.');if(r.status==='finished')throw Error('This game is finished. Create a new room.');const players=[...r.players,{uid:user.uid,name:cleanName()}];let state={...r.state};if(r.type==='ttt')state={...state,board:Array.isArray(state.board)&&state.board.length===9?state.board:Array(9).fill(''),turn:state.turn||r.createdBy,winner:'',moves:Number.isInteger(state.moves)?state.moves:0};if(r.type==='dice')state={...state,positions:{...(state.positions||{}),[user.uid]:0},turn:state.turn||r.createdBy};if(r.type==='quiz')state={...state,answers:state.answers||{},scores:state.scores||{},finished:false};if(r.type==='draw')state={...state,strokes:state.strokes||[],guesses:state.guesses||[],solved:false};tx.update(ref,{players,status:'playing',state,updatedAt:serverTimestamp()})});watchRoom(id);say('Joined room.')}catch(e){say('Could not join: '+e.message)}finally{busy=false}}
function watchRoom(id){if(unsub)unsub();activeRoomId=id;unsub=onSnapshot(roomRef(id),snap=>{if(!snap.exists()){say('Room was deleted.');return}activeRoom=snap.data();$('gamePanel').classList.remove('hidden');$('roomLine').textContent='Room ID: '+id+' | Status: '+activeRoom.status;$('playersLine').textContent='Players: '+activeRoom.players.map(p=>p.name+(p.uid===user?.uid?' (You)':'')).join(' vs ');$('activeGameTitle').textContent=({ttt:'Tic-Tac-Toe',quiz:'Rapid Quiz Battle',draw:'Draw & Guess',dice:'Mini Ludo / Dice Race'})[activeRoom.type]||'Game';renderGame();if(activeRoom.status==='finished')gameSay('Game finished. You can create a new room to play again.');if(activeRoom.type==='draw')checkDrawGuesses()},e=>gameSay('Live sync error: '+e.message))}
function isMyTurn(){return activeRoom?.state?.turn===user?.uid}
function renderGame(){if(!activeRoom||!user)return;const type=activeRoom.type,s=activeRoom.state||{},box=$('gameContent');box.replaceChildren();if(activeRoom.players.length<2){const p=document.createElement('p');p.textContent='Waiting for your friend to join. Share the Room ID.';box.append(p);return}if(type==='ttt')renderTTT(box,s);else if(type==='quiz')renderQuiz(box,s);else if(type==='draw')renderDraw(box,s);else renderDice(box,s)}
function addText(parent,tag,text){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function renderTTT(box,s){addText(box,'p',s.winner?(s.winner==='draw'?'Game draw.':(activeRoom.players.find(p=>p.uid===s.winner)?.name||'Player')+' won!'):(isMyTurn()?'Your turn.':'Opponent turn.'));const b=document.createElement('div');b.className='board';s.board.forEach((value,i)=>{const btn=document.createElement('button');btn.className='cell';btn.textContent=value||' ';btn.setAttribute('aria-label','Square '+(i+1)+(value?', '+value:' empty'));btn.disabled=!!s.winner||!isMyTurn()||!!value;btn.addEventListener('click',()=>moveTTT(i));b.append(btn)});box.append(b);addText(box,'p','You are '+(activeRoom.players[0].uid===user.uid?'X':'O')+'.')}
async function moveTTT(i){if(!Number.isInteger(i)||i<0||i>8)return;try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref);if(!snap.exists())throw Error('Room not found.');const r=snap.data(),s=r.state;if(r.status!=='playing'||r.players.length!==2||s.turn!==user.uid||s.board[i]||s.winner)throw Error('It is not your turn.');const board=[...s.board];board[i]=r.players[0].uid===user.uid?'X':'O';const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let winner='';if(lines.some(line=>board[line[0]]!==''&&line.every(n=>board[n]===board[line[0]])))winner=user.uid;else if(board.every(Boolean))winner='draw';tx.update(ref,{state:{...s,board,turn:r.players.find(p=>p.uid!==user.uid)?.uid||user.uid,winner,moves:s.moves+1},status:winner?'finished':'playing',updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
function renderQuiz(box,s){const q=questions[s.questionIndex%questions.length];addText(box,'p','Question '+(s.round+1)+': '+q.q);addText(box,'p','Scores: '+activeRoom.players.map(p=>p.name+' '+(s.scores?.[p.uid]||0)).join(' | '));if(s.answers?.[user.uid]!==undefined)addText(box,'p','Your answer is locked. Waiting for the other player.');else{const opts=document.createElement('div');opts.className='quizOptions';q.a.forEach((a,i)=>{const btn=document.createElement('button');btn.textContent=String.fromCharCode(65+i)+'. '+a;btn.addEventListener('click',()=>answerQuiz(i));opts.append(btn)});box.append(opts)}if(s.round>=5||s.finished)addText(box,'p','Quiz complete! Final score: '+activeRoom.players.map(p=>p.name+' '+(s.scores?.[p.uid]||0)).join(' | '));else if(Object.keys(s.answers||{}).length>=2){const btn=document.createElement('button');btn.className='accent';btn.textContent='Next question';btn.addEventListener('click',nextQuiz);box.append(btn)}}
async function answerQuiz(choice){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.answers?.[user.uid]!==undefined)throw Error('Answer already submitted.');const q=questions[s.questionIndex%questions.length],answers={...(s.answers||{}),[user.uid]:choice},scores={...(s.scores||{})};scores[user.uid]=(scores[user.uid]||0)+(choice===q.correct?1:0);const finished=Object.keys(answers).length>=2&&s.round>=4;tx.update(ref,{state:{...s,answers,scores,finished},status:finished?'finished':'playing',updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
async function nextQuiz(){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(r.createdBy!==user.uid)throw Error('Only the room creator can start the next question.');if(Object.keys(s.answers||{}).length<2)throw Error('Both players must answer first.');if(s.round>=4)throw Error('Quiz completed.');tx.update(ref,{state:{...s,round:s.round+1,questionIndex:(s.questionIndex+1)%questions.length,answers:{},finished:false},updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
async function renderDraw(box,s){const meDrawer=s.drawer===user.uid;if(meDrawer){addText(box,'p','You draw. Keep the secret word hidden.');try{const secretSnap=await getDoc(doc(db,'games',activeRoomId,'private','secret'));if(secretSnap.exists()&&activeRoomId){const p=document.createElement('p');p.textContent='Your word: '+secretSnap.data().word;box.prepend(p)}}catch(e){gameSay('Could not read secret word. Check Firestore rules.')}}else addText(box,'p','Watch the drawing and guess the word.');if(s.solved)addText(box,'p','Word guessed!');const wrap=document.createElement('div');wrap.className='canvasWrap';canvas=document.createElement('canvas');canvas.width=600;canvas.height=450;canvas.setAttribute('aria-label','Shared drawing canvas. Use mouse or touch to draw.');ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,600,450);(s.strokes||[]).forEach(drawStroke);wrap.append(canvas);box.append(wrap);if(meDrawer&&!s.solved){canvas.style.cursor='crosshair';canvas.addEventListener('pointerdown',startDraw);canvas.addEventListener('pointermove',moveDraw);window.addEventListener('pointerup',endDraw,{once:true});const clear=document.createElement('button');clear.textContent='Clear drawing';clear.addEventListener('click',clearDrawing);box.append(clear)}else canvas.style.cursor='default';const form=document.createElement('form');form.className='row';form.style.marginTop='10px';const input=document.createElement('input');input.placeholder='Type your guess';input.maxLength=80;input.setAttribute('aria-label','Guess the word');input.style.cssText='flex:1;min-width:180px;background:#111;color:#fff;padding:10px;border:1px solid #555;border-radius:8px';const submit=document.createElement('button');submit.textContent='Send guess';submit.disabled=meDrawer||s.solved;form.append(input,submit);form.addEventListener('submit',e=>{e.preventDefault();submitGuess(input.value)});box.append(form);const log=document.createElement('div');log.className='guesslog';(s.guesses||[]).slice(-12).forEach(g=>addText(log,'p',g.name+': '+g.text));box.append(log)}
function drawStroke(st){if(!ctx||!st.points||st.points.length<1)return;ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(st.points[0].x,st.points[0].y);st.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(600,(e.clientX-r.left)*600/r.width)),y:Math.max(0,Math.min(450,(e.clientY-r.top)*450/r.height))}}
function startDraw(e){if(!canvas||activeRoom.state.drawer!==user.uid||activeRoom.state.solved)return;drawing=true;lastPoint=point(e);canvas.setPointerCapture?.(e.pointerId)}
function moveDraw(e){if(!drawing||!lastPoint)return;const p=point(e);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lastPoint.x,lastPoint.y);ctx.lineTo(p.x,p.y);ctx.stroke();if(!window._pendingStroke)window._pendingStroke=[];window._pendingStroke.push(lastPoint,p);lastPoint=p}
async function endDraw(){if(!drawing)return;drawing=false;lastPoint=null;const points=window._pendingStroke||[];window._pendingStroke=[];if(points.length<2)return;const compact=points.filter((p,i)=>i%2===0||i===points.length-1).slice(0,120);try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.drawer!==user.uid||s.solved)throw Error('Drawing turn finished.');tx.update(ref,{state:{...s,strokes:[...(s.strokes||[]),{points:compact}].slice(-100)},updatedAt:serverTimestamp()})})}catch(e){gameSay('Drawing sync failed: '+e.message)}}
async function clearDrawing(){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.drawer!==user.uid)throw Error('Only the drawer can clear the drawing.');tx.update(ref,{state:{...s,strokes:[]},updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
async function submitGuess(raw){const guess=String(raw||'').trim().slice(0,80);if(!guess)return;try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref);if(!snap.exists())throw Error('Room not found.');const r=snap.data(),s=r.state;if(s.drawer===user.uid||s.solved||r.status!=='playing')throw Error('Cannot send a guess now.');const guesses=[...(s.guesses||[]),{uid:user.uid,name:cleanName(),text:guess}].slice(-50);tx.update(ref,{state:{...s,guesses},updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
let drawCheckBusy=false;async function checkDrawGuesses(){if(drawCheckBusy||!user||!activeRoomId||!activeRoom||activeRoom.type!=='draw'||activeRoom.state?.drawer!==user.uid||activeRoom.state?.solved||activeRoom.status!=='playing')return;const guesses=activeRoom.state.guesses||[];if(!guesses.length)return;drawCheckBusy=true;try{const secretSnap=await getDoc(doc(db,'games',activeRoomId,'private','secret'));if(!secretSnap.exists())return;const secret=String(secretSnap.data().word||'').trim().toLowerCase(),last=guesses[guesses.length-1];if(!secret||!last||String(last.text||'').trim().toLowerCase()!==secret)return;await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref);if(!snap.exists())return;const r=snap.data(),s=r.state,latest=(s.guesses||[]).slice(-1)[0];if(r.status!=='playing'||s.drawer!==user.uid||s.solved||!latest||String(latest.text||'').trim().toLowerCase()!==secret)return;tx.update(ref,{state:{...s,solved:true},status:'finished',updatedAt:serverTimestamp()})});gameSay('Correct! Your friend guessed the word.')}catch(e){gameSay('Guess check failed: '+e.message)}finally{drawCheckBusy=false}}
function renderDice(box,s){addText(box,'p','Finish at 30. Roll the dice on your turn.');activeRoom.players.forEach(p=>addText(box,'p',p.name+': '+(s.positions?.[p.uid]||0)+'/30'));const d=addText(box,'div',s.dice===null?'🎲':'🎲 Last roll: '+s.dice);d.className='dice';addText(box,'p',s.winner?(activeRoom.players.find(p=>p.uid===s.winner)?.name+' won!'):(isMyTurn()?'Your turn.':'Opponent turn.'));const btn=document.createElement('button');btn.className='accent';btn.textContent='Roll dice';btn.disabled=!isMyTurn()||!!s.winner;btn.addEventListener('click',rollDice);box.append(btn)}
async function rollDice(){const roll=1+Math.floor(Math.random()*6);try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.turn!==user.uid||s.winner)throw Error('It is not your turn.');const positions={...s.positions,[user.uid]:Math.min(30,(s.positions[user.uid]||0)+roll)},winner=positions[user.uid]>=30?user.uid:'';tx.update(ref,{state:{...s,positions,dice:roll,rolls:(s.rolls||0)+1,turn:winner?user.uid:(r.players.find(p=>p.uid!==user.uid)?.uid||user.uid),winner},status:winner?'finished':'playing',updatedAt:serverTimestamp()})})}catch(e){gameSay(e.message)}}
$('createRoomBtn').addEventListener('click',()=>createRoom($('gameType').value));$('joinRoomBtn').addEventListener('click',()=>joinRoom($('roomIdInput').value));document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>{$('gameType').value=b.dataset.game;createRoom(b.dataset.game)}));$('copyRoomBtn').addEventListener('click',async()=>{if(!activeRoomId)return;try{await navigator.clipboard.writeText(activeRoomId);gameSay('Room ID copied: '+activeRoomId)}catch(e){gameSay('Room ID: '+activeRoomId+' — select and copy it.')}});$('leaveRoomBtn').addEventListener('click',()=>{if(unsub)unsub();unsub=null;activeRoomId='';activeRoom=null;$('gamePanel').classList.add('hidden');gameSay('You left the room. The room may remain available to the other player.')});
</script>
</body>
</html>
