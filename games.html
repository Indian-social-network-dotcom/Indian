<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Game Zone 🎮</title>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--accent:#ff9800;--text:#f5f5f5;--muted:#c5c5c5;--line:#383838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #5b5b5b;border-radius:10px;padding:10px 14px;background:#292929;color:#fff}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.top{position:sticky;top:0;z-index:5;background:#181818;border-bottom:1px solid var(--line);padding:12px max(14px,calc((100vw - 1050px)/2));display:flex;gap:14px;align-items:center}.top h1{font-size:1.15rem;margin:0;color:var(--accent);flex:1}.accent{background:var(--accent);color:#161616;border-color:var(--accent);font-weight:800}.wrap{width:min(1050px,100%);margin:auto;padding:18px 14px 40px}.intro{color:var(--muted)}.status{padding:12px;border-radius:10px;background:#202020;border:1px solid var(--line);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}.game-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.game-card h2{margin:0 0 8px;color:var(--accent);font-size:1.1rem}.game-card p{color:var(--muted);min-height:48px}.game-card button{width:100%}.hidden{display:none!important}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{width:100%;min-width:0;background:#101010;color:#fff;border:1px solid #555;border-radius:9px;padding:11px}.panel h2{color:var(--accent);margin-top:0}.roomline{overflow-wrap:anywhere;color:#ffd180}.board{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:7px;margin:14px 0}.cell{height:90px;font-size:2rem;font-weight:900;color:var(--accent);padding:0}.quizOptions{display:grid;gap:8px;max-width:500px}.quizOptions button{text-align:left}.canvasWrap{max-width:650px}.canvasWrap canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:10px;touch-action:none;border:1px solid #777}.guesslog{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.guesslog p{margin:4px 0}.dice{font-size:3rem;color:var(--accent)}.players{color:var(--muted)}.foot{color:#aaa;font-size:.9rem;margin-top:24px}a{color:#ffd180}@media(max-width:480px){.top{gap:8px;padding:10px}.top h1{font-size:1rem}.wrap{padding:12px 10px 30px}.cell{height:75px}}
</style>
</head>
<body>
<header class="top"><button type="button" onclick="goBack()" aria-label="Back to Indian website">⬅️ Back</button><h1>Indian Game Zone 🎮</h1></header>
<main class="wrap">

<div id="globalStatus" class="status" role="status" aria-live="polite">Firebase se connect ho raha hai…</div>
<section class="panel" aria-labelledby="roomHeading"><h2 id="roomHeading">Online room</h2><div class="row"><label class="field" style="flex:1;min-width:180px"><span>Apna display name</span><input id="playerName" maxlength="40" autocomplete="nickname" placeholder="Aapka naam"></label><label class="field" style="flex:1;min-width:180px"><span>Game select karein</span><select id="gameType"><option value="ttt">Tic-Tac-Toe</option><option value="quiz">Rapid Quiz Battle</option><option value="draw">Draw &amp; Guess</option><option value="dice">Mini Ludo / Dice Race</option></select></label></div><div class="row"><button class="accent" id="createRoomBtn" type="button">Create new room</button><label class="field" style="flex:1;min-width:190px"><span>Friend ka Room ID</span><input id="roomIdInput" maxlength="8" autocomplete="off" placeholder="Room ID"></label><button id="joinRoomBtn" type="button">Join room</button></div></section>
<section id="gamePanel" class="panel hidden" aria-labelledby="activeGameTitle" style="margin-top:16px"><h2 id="activeGameTitle">Game</h2><p id="roomLine" class="roomline"></p><p id="playersLine" class="players"></p><div id="gameContent"></div><div class="row" style="margin-top:16px"><button type="button" id="copyRoomBtn">Copy Room ID</button><button type="button" id="leaveRoomBtn">Leave room</button></div><p id="gameStatus" class="status" role="status" aria-live="polite">Room ready.</p></section>
<section class="grid" aria-label="Available games"><article class="game-card"><h2>⚡ Rapid Quiz Battle</h2><button type="button" data-game="quiz">Play Quiz</button></article><article class="game-card"><h2>🎨 Draw &amp; Guess</h2><button type="button" data-game="draw">Play Draw &amp; Guess</button></article><article class="game-card"><h2>🎲 Mini Ludo / Dice Race</h2><button type="button" data-game="dice">Play Dice Race</button></article><article class="game-card"><h2>❎ Tic-Tac-Toe</h2><button type="button" data-game="ttt">Play Tic-Tac-Toe</button></article></section>

</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, onSnapshot, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDyXo7dNZXnSZkRKFnLujjiElMIjcuRQUs',authDomain:'indian-84a86.firebaseapp.com',projectId:'indian-84a86',storageBucket:'indian-84a86.firebasestorage.app',messagingSenderId:'333987809341',appId:'1:333987809341:web:27a351f770aa7b4e808254'};
const $=id=>document.getElementById(id);let app,auth,db,user=null,activeRoomId='',activeRoom=null,unsub=null,busy=false,canvas=null,ctx=null,drawing=false,lastPoint=null;
const questions=[{q:'Bharat ki rajdhani kya hai?',a:['Mumbai','New Delhi','Kolkata','Jaipur'],correct:1},{q:'Ek hafte mein kitne din hote hain?',a:['5','6','7','8'],correct:2},{q:'Suraj kis disha se ugta hai?',a:['North','South','East','West'],correct:2},{q:'Paani ka chemical formula kya hai?',a:['CO2','O2','H2O','NaCl'],correct:2},{q:'3 × 4 kitna hota hai?',a:['7','12','14','16'],correct:1},{q:'Bharat ka rashtriya pashu?',a:['Sher','Baagh','Hathi','Mor'],correct:1},{q:'Rainbow mein aam taur par kitne rang bataye jate hain?',a:['5','6','7','8'],correct:2}];
const words=['Mango','Bicycle','Elephant','House','Sun','Fish','Cup','Tree'];
function say(msg){$('globalStatus').textContent=msg}function gameSay(msg){$('gameStatus').textContent=msg}function cleanName(){return String($('playerName').value||user?.displayName||user?.email?.split('@')[0]||'Indian Player').replace(/[<>\u0000-\u001f]/g,'').trim().slice(0,40)||'Indian Player'}
window.goBack=()=>{location.href='index.html'};
try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{user=u;if(u){$('playerName').value=$('playerName').value||u.displayName||u.email?.split('@')[0]||'Indian Player';say('Firebase connected. Signed in: '+(u.displayName||u.email||'Indian account')+'.');$('createRoomBtn').disabled=false;$('joinRoomBtn').disabled=false;}else{say('Pehle Indian website par apne Firebase account mein sign in karein, phir Game Zone kholein.');$('createRoomBtn').disabled=true;$('joinRoomBtn').disabled=true;}});}catch(e){say('Firebase initialization error: '+e.message);}
function roomRef(id){return doc(db,'games',id)}function randomId(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function initialState(type,uid){if(type==='ttt')return {board:Array(9).fill(''),turn:uid,winner:'',moves:0};if(type==='quiz')return {round:0,questionIndex:Math.floor(Math.random()*questions.length),answers:{},scores:{},finished:false};if(type==='draw')return {round:0,drawer:uid,strokes:[],guesses:[],solved:false};return {positions:{[uid]:0},turn:uid,dice:null,winner:'',rolls:0};}
async function createRoom(type){if(!user||busy)return;busy=true;try{const id=randomId(),name=cleanName();const room={type,status:'waiting',createdBy:user.uid,players:[{uid:user.uid,name}],createdAt:serverTimestamp(),state:initialState(type,user.uid),updatedAt:serverTimestamp()};await setDoc(roomRef(id),room);if(type==='draw')await setDoc(doc(db,'games',id,'private','secret'),{word:words[Math.floor(Math.random()*words.length)],createdBy:user.uid});$('roomIdInput').value=id;watchRoom(id);say('Room create ho gaya. Apne dost ko Room ID '+id+' bhejein.');}catch(e){say('Room create nahi hua: '+e.message+' Security rules publish kiye hain?');}finally{busy=false;}}
async function joinRoom(id){if(!user||busy)return;id=String(id||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(id)){say('Room ID 6 characters ka hona chahiye.');return;}busy=true;try{const ref=roomRef(id);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw Error('Room nahi mila. Room ID check karein.');const r=snap.data();if(r.players.some(p=>p.uid===user.uid))return;if(r.players.length>=2)throw Error('Room already full hai.');if(r.status==='finished')throw Error('Yeh game khatam ho chuka hai. Naya room banayein.');const players=[...r.players,{uid:user.uid,name:cleanName()}];let state={...r.state};if(r.type==='ttt')state={...state,board:Array.isArray(state.board)&&state.board.length===9?state.board:Array(9).fill(''),turn:state.turn||r.createdBy,winner:'',moves:Number.isInteger(state.moves)?state.moves:0};if(r.type==='dice')state={...state,positions:{...(state.positions||{}),[user.uid]:0},turn:state.turn||r.createdBy};if(r.type==='quiz')state={...state,answers:state.answers||{},scores:state.scores||{},finished:false};if(r.type==='draw')state={...state,strokes:state.strokes||[],guesses:state.guesses||[],solved:false};tx.update(ref,{players,status:'playing',state,updatedAt:serverTimestamp()});});watchRoom(id);say('Room join ho gaya.');}catch(e){say('Join nahi hua: '+e.message);}finally{busy=false;}}
function watchRoom(id){if(unsub)unsub();activeRoomId=id;unsub=onSnapshot(roomRef(id),snap=>{if(!snap.exists()){say('Room delete ho gaya.');return;}activeRoom=snap.data();$('gamePanel').classList.remove('hidden');$('roomLine').textContent='Room ID: '+id+' | Status: '+activeRoom.status;$('playersLine').textContent='Players: '+activeRoom.players.map(p=>p.name+(p.uid===user?.uid?' (You)':'')).join(' vs ');$('activeGameTitle').textContent=({ttt:'❎ Tic-Tac-Toe',quiz:'⚡ Rapid Quiz Battle',draw:'🎨 Draw & Guess',dice:'🎲 Mini Ludo / Dice Race'})[activeRoom.type]||'Game';renderGame();if(activeRoom.status==='finished')gameSay('Game finished. Aap naya room bana kar dobara khel sakte hain.');if(activeRoom.type==='draw')checkDrawGuesses();},e=>{gameSay('Live sync error: '+e.message);});}
function me(){return activeRoom?.players?.find(p=>p.uid===user?.uid)}function opponent(){return activeRoom?.players?.find(p=>p.uid!==user?.uid)}function isMyTurn(){return activeRoom?.state?.turn===user?.uid}
function renderGame(){if(!activeRoom||!user)return;const type=activeRoom.type;const s=activeRoom.state||{};const box=$('gameContent');box.replaceChildren();if(activeRoom.players.length<2){const p=document.createElement('p');p.textContent='Dost ke join karne ka intezar hai. Room ID share karein.';box.append(p);return;}if(type==='ttt')renderTTT(box,s);else if(type==='quiz')renderQuiz(box,s);else if(type==='draw')renderDraw(box,s);else renderDice(box,s);}
function addText(parent,tag,text){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function renderTTT(box,s){addText(box,'p',s.winner?(s.winner==='draw'?'Game draw ho gaya.':(activeRoom.players.find(p=>p.uid===s.winner)?.name||'Player')+' jeet gaye!'):(isMyTurn()?'Aapki baari.':'Opponent ki baari.'));const b=document.createElement('div');b.className='board';s.board.forEach((value,i)=>{const btn=document.createElement('button');btn.className='cell';btn.textContent=value||' ';btn.setAttribute('aria-label','Square '+(i+1)+(value?', '+value:' empty'));btn.disabled=!!s.winner||!isMyTurn()||!!value;btn.addEventListener('click',()=>moveTTT(i));b.append(btn)});box.append(b);addText(box,'p','You are '+(activeRoom.players[0].uid===user.uid?'X':'O')+'.');}
async function moveTTT(i){const id=activeRoomId;if(!Number.isInteger(i)||i<0||i>8)return;try{await runTransaction(db,async tx=>{const ref=roomRef(id),snap=await tx.get(ref);if(!snap.exists())throw Error('Room nahi mila.');const r=snap.data(),s=r.state;if(r.status!=='playing'||r.players.length!==2||s.turn!==user.uid||s.board[i]||s.winner)throw Error('Abhi aapki baari nahi hai.');const board=[...s.board];board[i]=r.players[0].uid===user.uid?'X':'O';const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let winner='';if(lines.some(line=>board[line[0]]!==''&&line.every(n=>board[n]===board[line[0]])))winner=user.uid;else if(board.every(Boolean))winner='draw';tx.update(ref,{state:{...s,board,turn:r.players.find(p=>p.uid!==user.uid)?.uid||user.uid,winner,moves:s.moves+1},status:winner?'finished':'playing',updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
function renderQuiz(box,s){const q=questions[s.questionIndex%questions.length];addText(box,'p','Question '+(s.round+1)+': '+q.q);addText(box,'p','Scores: '+activeRoom.players.map(p=>p.name+' '+(s.scores?.[p.uid]||0)).join(' | '));if(s.answers?.[user.uid]!==undefined){addText(box,'p','Aapka answer lock ho gaya. Opponent ke jawab ka intezar karein.');}else{const opts=document.createElement('div');opts.className='quizOptions';q.a.forEach((a,i)=>{const btn=document.createElement('button');btn.textContent=String.fromCharCode(65+i)+'. '+a;btn.addEventListener('click',()=>answerQuiz(i));opts.append(btn)});box.append(opts);}if(s.round>=5||s.finished){addText(box,'p','Quiz complete! Final score: '+activeRoom.players.map(p=>p.name+' '+(s.scores?.[p.uid]||0)).join(' | '));}else if(Object.keys(s.answers||{}).length>=2){const btn=document.createElement('button');btn.className='accent';btn.textContent='Next question';btn.addEventListener('click',nextQuiz);box.append(btn);}}
async function answerQuiz(choice){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.answers?.[user.uid]!==undefined)throw Error('Answer already submitted.');const q=questions[s.questionIndex%questions.length],answers={...(s.answers||{}),[user.uid]:choice},scores={...(s.scores||{})};scores[user.uid]=(scores[user.uid]||0)+(choice===q.correct?1:0);const finished=Object.keys(answers).length>=2&&s.round>=4;tx.update(ref,{state:{...s,answers,scores,finished},status:finished?'finished':'playing',updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
async function nextQuiz(){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(r.createdBy!==user.uid)throw Error('Next question room creator start kare.');if(Object.keys(s.answers||{}).length<2)throw Error('Dono players ke answer ke baad next question.');if(s.round>=4)throw Error('Quiz complete ho gaya.');tx.update(ref,{state:{...s,round:s.round+1,questionIndex:(s.questionIndex+1)%questions.length,answers:{},finished:false},updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
async function renderDraw(box,s){const meDrawer=s.drawer===user.uid;if(meDrawer){addText(box,'p','Aap drawer hain. Aapka secret word sirf aapko dikhna chahiye.');try{const secretSnap=await getDoc(doc(db,'games',activeRoomId,'private','secret'));if(secretSnap.exists()&&activeRoomId){const word=secretSnap.data().word;const p=document.createElement('p');p.textContent='Aapka word: '+word+' (dost ko na batayein!)';box.prepend(p);}}catch(e){gameSay('Secret word nahi padha ja saka. Firestore Rules mein private secret access add karna hoga.');}}else{addText(box,'p','Drawer drawing kar raha hai. Drawing dekhkar word guess karein.');}if(s.solved)addText(box,'p','Correct! Word tha: '+s.word);const wrap=document.createElement('div');wrap.className='canvasWrap';canvas=document.createElement('canvas');canvas.width=600;canvas.height=450;canvas.setAttribute('aria-label','Shared drawing canvas. Drawing ke liye mouse ya touch use karein.');ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,600,450);(s.strokes||[]).forEach(st=>drawStroke(st));wrap.append(canvas);box.append(wrap);if(meDrawer&&!s.solved){canvas.style.cursor='crosshair';canvas.addEventListener('pointerdown',startDraw);canvas.addEventListener('pointermove',moveDraw);window.addEventListener('pointerup',endDraw,{once:true});const clear=document.createElement('button');clear.textContent='Clear drawing';clear.addEventListener('click',clearDrawing);box.append(clear);}else canvas.style.cursor='default';const form=document.createElement('form');form.className='row';form.style.marginTop='12px';const input=document.createElement('input');input.placeholder='Apna guess likhein';input.maxLength=80;input.setAttribute('aria-label','Guess the word');input.style.cssText='flex:1;min-width:180px;background:#111;color:#fff;padding:11px;border:1px solid #555;border-radius:8px';const submit=document.createElement('button');submit.textContent='Submit guess';submit.disabled=meDrawer||s.solved;form.append(input,submit);form.addEventListener('submit',e=>{e.preventDefault();submitGuess(input.value)});box.append(form);const log=document.createElement('div');log.className='guesslog';(s.guesses||[]).slice(-12).forEach(g=>addText(log,'p',g.name+': '+g.text));box.append(log);}
function drawStroke(st){if(!ctx||!st.points||st.points.length<1)return;ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(st.points[0].x,st.points[0].y);st.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(600,(e.clientX-r.left)*600/r.width)),y:Math.max(0,Math.min(450,(e.clientY-r.top)*450/r.height))}}
function startDraw(e){if(!canvas||activeRoom.state.drawer!==user.uid||activeRoom.state.solved)return;drawing=true;lastPoint=point(e);canvas.setPointerCapture?.(e.pointerId)}function moveDraw(e){if(!drawing||!lastPoint)return;const p=point(e);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lastPoint.x,lastPoint.y);ctx.lineTo(p.x,p.y);ctx.stroke();if(!window._pendingStroke)window._pendingStroke=[];window._pendingStroke.push(lastPoint,p);lastPoint=p}async function endDraw(){if(!drawing)return;drawing=false;lastPoint=null;const points=window._pendingStroke||[];window._pendingStroke=[];if(points.length<2)return;const compact=points.filter((p,i)=>i%2===0||i===points.length-1).slice(0,120);try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.drawer!==user.uid||s.solved)throw Error('Drawing turn khatam ho gaya.');tx.update(ref,{state:{...s,strokes:[...(s.strokes||[]),{points:compact}].slice(-100)},updatedAt:serverTimestamp()});});}catch(e){gameSay('Drawing sync nahi hua: '+e.message)}}
async function clearDrawing(){try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.drawer!==user.uid)throw Error('Sirf drawer clear kar sakta hai.');tx.update(ref,{state:{...s,strokes:[]},updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
async function submitGuess(raw){const guess=String(raw||'').trim().slice(0,80);if(!guess)return;try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref);if(!snap.exists())throw Error('Room nahi mila.');const r=snap.data(),s=r.state;if(s.drawer===user.uid||s.solved||r.status!=='playing')throw Error('Abhi guess submit nahi kar sakte.');const guesses=[...(s.guesses||[]),{uid:user.uid,name:cleanName(),text:guess}].slice(-50);tx.update(ref,{state:{...s,guesses},updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
let drawCheckBusy=false;async function checkDrawGuesses(){if(drawCheckBusy||!user||!activeRoomId||!activeRoom||activeRoom.type!=='draw'||activeRoom.state?.drawer!==user.uid||activeRoom.state?.solved||activeRoom.status!=='playing')return;const guesses=activeRoom.state.guesses||[];if(!guesses.length)return;drawCheckBusy=true;try{const secretSnap=await getDoc(doc(db,'games',activeRoomId,'private','secret'));if(!secretSnap.exists())return;const secret=String(secretSnap.data().word||'').trim().toLowerCase();const last=guesses[guesses.length-1];if(!secret||!last||String(last.text||'').trim().toLowerCase()!==secret)return;await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref);if(!snap.exists())return;const r=snap.data(),s=r.state,latest=(s.guesses||[]).slice(-1)[0];if(r.status!=='playing'||s.drawer!==user.uid||s.solved||!latest||String(latest.text||'').trim().toLowerCase()!==secret)return;tx.update(ref,{state:{...s,solved:true},status:'finished',updatedAt:serverTimestamp()});});gameSay('Sahi jawab! Friend ne word guess kar liya.');}catch(e){gameSay('Guess check nahi hua: '+e.message);}finally{drawCheckBusy=false;}}
function renderDice(box,s){addText(box,'p','Finish line: 30 spaces. Apni baari par dice roll karein. 30 ya usse zyada par pahunchne wala pehle jeetega.');activeRoom.players.forEach(p=>{const pos=s.positions?.[p.uid]||0;addText(box,'p',p.name+': '+pos+'/30 '+(pos>=30?'🏁':''));});const d=addText(box,'div',s.dice===null?'🎲':('🎲 Last roll: '+s.dice));d.className='dice';addText(box,'p',s.winner?(activeRoom.players.find(p=>p.uid===s.winner)?.name+' jeet gaye!'):(isMyTurn()?'Aapki baari.':'Opponent ki baari.'));const btn=document.createElement('button');btn.className='accent';btn.textContent='Roll dice';btn.disabled=!isMyTurn()||!!s.winner;btn.addEventListener('click',rollDice);box.append(btn);}
async function rollDice(){const roll=1+Math.floor(Math.random()*6);try{await runTransaction(db,async tx=>{const ref=roomRef(activeRoomId),snap=await tx.get(ref),r=snap.data(),s=r.state;if(s.turn!==user.uid||s.winner)throw Error('Abhi aapki baari nahi hai.');const positions={...s.positions,[user.uid]:Math.min(30,(s.positions[user.uid]||0)+roll)};const winner=positions[user.uid]>=30?user.uid:'';tx.update(ref,{state:{...s,positions,dice:roll,rolls:(s.rolls||0)+1,turn:winner?user.uid:(r.players.find(p=>p.uid!==user.uid)?.uid||user.uid),winner},status:winner?'finished':'playing',updatedAt:serverTimestamp()});});}catch(e){gameSay(e.message)}}
$('createRoomBtn').addEventListener('click',()=>createRoom($('gameType').value));$('joinRoomBtn').addEventListener('click',()=>joinRoom($('roomIdInput').value));document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>{$('gameType').value=b.dataset.game;createRoom(b.dataset.game)}));$('copyRoomBtn').addEventListener('click',async()=>{if(!activeRoomId)return;try{await navigator.clipboard.writeText(activeRoomId);gameSay('Room ID copied: '+activeRoomId)}catch(e){gameSay('Room ID: '+activeRoomId+' — ise select karke copy karein.')}});$('leaveRoomBtn').addEventListener('click',()=>{if(unsub)unsub();unsub=null;activeRoomId='';activeRoom=null;$('gamePanel').classList.add('hidden');gameSay('Room se nikal gaye. Room doosre player ke liye available reh sakta hai.');});
</script>
</body></html>
