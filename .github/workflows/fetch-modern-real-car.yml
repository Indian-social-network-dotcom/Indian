name: Fetch modern CC0 racing car
on:
  push:
    branches:
      - feature/racing-modern-real-car
    paths:
      - 'indian-racing.html'
      - '.github/workflows/fetch-modern-real-car.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-modern-car:
    if: "!contains(github.event.head_commit.message, '[assets-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download detailed CC0 modern GT model
        run: |
          mkdir -p assets/racing-cars
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/JaronKBragg7337/spectral-gt-rs/main/spectral_gt_rs_game_ready.glb' \
            --output assets/racing-cars/spectral-gt-rs.glb
          test "$(stat -c%s assets/racing-cars/spectral-gt-rs.glb)" -gt 3000000
          file assets/racing-cars/spectral-gt-rs.glb
      - name: Record asset source and license
        run: |
          cat >> assets/racing-cars/README.txt <<'EOF'

          Spectral GT RS
          Source: https://github.com/JaronKBragg7337/spectral-gt-rs
          File: spectral-gt-rs.glb (game-ready GLB, approximately 4.7 MB)
          License: CC0 1.0 Universal, public domain; free to use, modify and redistribute.
          Model includes detailed exterior, cockpit, separate mechanical parts and four animation clips.
          EOF
      - name: Commit downloaded model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/racing-cars/spectral-gt-rs.glb assets/racing-cars/README.txt
          git commit -m "[assets-bot] Add detailed modern CC0 GT car model" || exit 0
          git push
